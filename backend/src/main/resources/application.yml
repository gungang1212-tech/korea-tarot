server:
  port: 8000

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/arcana?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:arcana}
    password: ${DB_PASSWORD:arcanapass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE

jwt:
  secret: ${JWT_SECRET:arcana-super-secret-key-must-be-at-least-32-characters-long}
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000

ai-server:
  url: ${AI_SERVER_URL:http://localhost:8001}
  timeout: 60000

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
